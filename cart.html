<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velora - Shopping Cart</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f9; padding: 40px 20px; }
        .cart-container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { border-bottom: 2px solid #eee; padding-bottom: 10px; color: #333; }
        .cart-item { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #eee; padding: 15px 0; }
        .cart-item img { width: 70px; height: 70px; object-fit: cover; border-radius: 8px; }
        .item-details { flex-grow: 1; margin-left: 20px; }
        .item-details h4 { margin: 0 0 5px 0; color: #2c3e50; }
        .price { font-weight: bold; color: #6c5ce7; }
        .remove-btn { background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .cart-summary { margin-top: 20px; text-align: right; }
        .total-price { font-size: 20px; font-weight: bold; margin-bottom: 15px; }
        .pay-btn { background: #27ae60; color: white; border: none; padding: 12px 25px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; }
    </style>
</head>
<body>

<div class="cart-container">
    <h2>Your Shopping Cart 🛒</h2>
    <div id="cart-list"></div>

    <div class="cart-summary" id="cart-summary" style="display:none;">
        <div class="total-price">Total: ₹<span id="cart-total">0</span></div>
        <a href="payment.html" class="pay-btn">Proceed to Payment 💳</a>
    </div>
</div>

<script>
    function renderCart() {
        const cart = JSON.parse(localStorage.getItem('cart') || '[]');
        const container = document.getElementById('cart-list');
        const summary = document.getElementById('cart-summary');

        if (cart.length === 0) {
            container.innerHTML = "<p style='text-align:center;'>Your cart is currently empty! <a href='index.html'>Go Shopping</a></p>";
            summary.style.display = "none";
            return;
        }

        container.innerHTML = "";
        let total = 0;

        cart.forEach((item, index) => {
            const itemTotal = item.price * (item.quantity || 1);
            total += itemTotal;

            container.innerHTML += `
                <div class="cart-item">
                    <img src="${item.image}" alt="${item.name}">
                    <div class="item-details">
                        <h4>${item.name}</h4>
                        <p class="price">₹${item.price} x ${item.quantity || 1}</p>
                    </div>
                    <button class="remove-btn" onclick="removeItem(${index})">Remove</button>
                </div>
            `;
        });

        document.getElementById('cart-total').textContent = total;
        summary.style.display = "block";
    }

    function removeItem(index) {
        let cart = JSON.parse(localStorage.getItem('cart') || '[]');
        cart.splice(index, 1);
        localStorage.setItem('cart', JSON.stringify(cart));
        renderCart();
    }

    document.addEventListener('DOMContentLoaded', renderCart);
</script>

</body>
</html>
